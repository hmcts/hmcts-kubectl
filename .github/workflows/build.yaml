name: Build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: 'ACR Login'
        run: |
          az acr login --name hmctsprod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kubectl-image:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test kubectl installation
        run: |
          echo "Testing kubectl is installed..."
          docker run --rm kubectl-image:latest kubectl version --client
          
          echo "Testing kubectl can show help..."
          docker run --rm kubectl-image:latest kubectl --help
          
          echo "✅ All tests passed"
